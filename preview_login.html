<!DOCTYPE html>
<html>
<head>
    <title>MCH-FUS Preview</title>
    <style>
        body { background-color: #0F172A; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1A2234; padding: 40px; border-radius: 8px; border: 1px solid #ffffff10; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; text-align: center; margin-bottom: 8px; }
        p { text-align: center; color: #ffffff70; margin-bottom: 30px; }
        .input { width: 100%; padding: 12px; margin: 10px 0; background: transparent; border: 1px solid #ffffff20; border-radius: 4px; color: white; box-sizing: border-box; }
        .button { width: 100%; padding: 12px; background: #3B82F6; border: none; border-radius: 4px; color: white; cursor: pointer; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div style="text-align:center; margin-bottom: 20px;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="#3B82F6"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <h1>Sign in</h1>
        <p>Use your MCH-FUS Account</p>
        <input type="text" class="input" placeholder="Email or phone">
        <button class="button">Next</button>
        <div style="display: flex; justify-content: space-between; margin-top: 40px;">
            <span style="color: #3B82F6; font-size: 14px; font-weight: bold; cursor: pointer;">Create account</span>
        </div>
    </div>
</body>
</html>
