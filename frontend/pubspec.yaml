name: mch_fus
description: Maternal and Child Health Follow-Up System

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.1
  http: ^1.1.0
  shared_preferences: ^2.2.1
  flutter_secure_storage: ^9.0.0
  provider: ^6.0.5
  sqflite: ^2.3.0
  path: ^1.8.3
  fl_chart: ^0.63.0
  flutter_neumorphic_plus: ^3.0.0
  glassmorphism: ^3.0.0
  flutter_animate: ^4.2.0
  google_fonts: ^6.1.0
  lottie: ^2.6.0
  animations: ^2.0.8
  web_socket_channel: ^2.4.0
  firebase_core: ^2.21.0
  firebase_messaging: ^14.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/
    - assets/images/
