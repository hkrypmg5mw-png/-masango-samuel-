services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mch_db}
      - POSTGRES_USER=${POSTGRES_USER:-mch_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mch_password}
  backend:
    build: ./backend
    command: python manage.py migrate && python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-mch-prod-key}
      - DEBUG=False
      - POSTGRES_NAME=${POSTGRES_DB:-mch_db}
      - POSTGRES_USER=${POSTGRES_USER:-mch_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mch_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data:
