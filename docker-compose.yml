version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=mch_db
      - POSTGRES_USER=mch_user
      - POSTGRES_PASSWORD=mch_password

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-mch-system-secret-key-cameroon
      - DATABASE_URL=postgres://mch_user:mch_password@db:5432/mch_db
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
